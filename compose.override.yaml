---
# Environnement de développement (lu automatiquement avec compose.yaml).
#
# Point d'entrée dans le navigateur : http://localhost:8000 (Vite), qui renvoie /api et /auth
# vers `php` pour rester sur une seule origine (cookies de session, T7). L'API reste
# joignable directement sur http://localhost:8080 pour le débogage.
services:
  php:
    build:
      context: .
      target: dev
    image: cdp-php-dev
    command: ["frankenphp", "run", "--config", "/etc/frankenphp/Caddyfile", "--watch"]
    volumes:
      - ./api:/app
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
    environment:
      APP_ENV: dev
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      MAILER_DSN: smtp://mailpit:1025
      # The personal links sent by email point to the front origin (Vite),
      # so the API redirects stay on the same origin as the SPA.
      DEFAULT_URI: http://localhost:${HTTP_PORT:-8000}
      FRANKENPHP_WORKER_CONFIG: watch
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${PHP_PORT:-8080}:80"
    tty: true

  # Consommateur Messenger local : sans lui, les e-mails Async (liens magiques,
  # confirmations) dorment dans l'outbox async_transactional — ils n'arrivent
  # jamais dans Mailpit. Miroir du service `worker` de prod (docker/stack/
  # stack.yaml) : les deux files dans un seul consommateur, --time-limit pour
  # recharger le code monté, restart pour compenser l'absence de supervisor.
  worker:
    build:
      context: .
      target: dev
    image: cdp-php-dev
    command:
      # Deux files PostgreSQL aux tables distinctes : un consommateur ne peut
      # pas lire les deux à la fois (contrainte DoctrineMessenger), d'où deux
      # processus comme dans le supervisor de prod.
      - sh
      - -c
      - |
        php bin/console messenger:consume async_transactional --time-limit=3600 &
        php bin/console messenger:consume async_bulk --time-limit=3600 &
        wait
    restart: unless-stopped
    volumes:
      - ./api:/app
    environment:
      APP_ENV: dev
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # Compose.yaml ne fournit DATABASE_URL qu'au service `php` : le worker,
      # service distinct, doit le porter (le .env monté vise 127.0.0.1).
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=18&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      # Même logique que `php` : les liens des e-mails pointent vers le front
      # (Vite), origine unique du parcours en session.
      DEFAULT_URI: http://localhost:${HTTP_PORT:-8000}
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    # L'image cdp-php-dev hérite du HEALTHCHECK HTTP de frankenphp (curl des
    # metrics) que le worker ne passe pas (pas de serveur web) : probe par
    # Messenger, comme la stack e2e.
    healthcheck:
      test: ["CMD-SHELL", "php bin/console messenger:stats > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    tty: true

  database:
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      # SMTP port also exposed on the host for host-run tooling (E2E worker)
      - "1025:1025"

  node:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./front:/app
    # Tant que front/ n'est pas initialisé (F00-T21), le conteneur attend au lieu de tomber.
    command:
      - sh
      - -c
      - |
        if [ ! -f package.json ]; then
          echo "front/ n'est pas encore initialisé (F00-T21)"
          exec sleep infinity
        fi
        npm install --global pnpm@12.14.0
        pnpm install
        exec pnpm dev --host 0.0.0.0
    ports:
      # Vite écoute sur 8000 dans le conteneur (front/vite.config.ts, baseURL Playwright).
      - "${HTTP_PORT:-8000}:8000"
