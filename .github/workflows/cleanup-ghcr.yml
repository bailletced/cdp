name: Cleanup GHCR

# F03-T18 : nettoyage des anciennes versions d'images GHCR.
# Garde les N dernières versions (tags sha-*), supprime le reste.
# Les tags "main" et "buildcache" (cache registry du build Docker, image.yml)
# sont toujours conservés.
# S'exécute hebdomadairement, après chaque push sur main, et manuellement.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Tous les lundis à 3h UTC
  workflow_dispatch:
    inputs:
      min_versions_to_keep:
        description: 'Nombre de versions à conserver'
        required: false
        default: '20'
      dry_run:
        description: 'Dry run (ne supprime rien)'
        required: false
        type: boolean
        default: false

jobs:
  cleanup:
    name: Delete old image versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Cleanup old GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # github.event.repository.name n'existe que pour push/PR.
          # On dérive le nom du package depuis github.repository (owner/repo).
          REPO_FULL: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          MIN_KEEP: ${{ inputs.min_versions_to_keep || '20' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="${REPO_FULL##*/}"
          echo "=== Package GHCR : ${OWNER}/${PACKAGE_NAME} ==="
          echo "=== Conserve les ${MIN_KEEP} dernières versions + tag 'main' ==="
          echo "=== Dry run : ${DRY_RUN} ==="
          echo ""

          # --- Détecter si le owner est un User ou une Organization ---
          # bailletced = User → endpoint /user/packages/...
          # Si org → endpoint /orgs/{org}/packages/...
          OWNER_TYPE=$(gh api "/users/${OWNER}" --jq '.type')
          if [ "$OWNER_TYPE" = "Organization" ]; then
            PACKAGES_BASE="/orgs/${OWNER}/packages"
          else
            PACKAGES_BASE="/user/packages"
          fi
          echo "Owner type: ${OWNER_TYPE} → API base: ${PACKAGES_BASE}"
          echo ""

          # --- Lister toutes les versions (page 1, max 100) ---
          VERSIONS_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "${PACKAGES_BASE}/container/${PACKAGE_NAME}/versions?per_page=100")

          TOTAL=$(echo "$VERSIONS_JSON" | jq 'length')
          echo "Total versions trouvées : $TOTAL"
          echo ""

          if [ "$TOTAL" -eq 0 ]; then
            echo "Aucune version trouvée. Rien à faire."
            exit 0
          fi

          # --- Afficher les versions avant cleanup ---
          echo "=== Versions avant cleanup ==="
          echo "$VERSIONS_JSON" | jq -r \
            '.[] | [.id, (.metadata.container.tags[0] // "untagged"), .created_at] | @tsv' \
            | sort -t$'\t' -k3 -r
          echo ""

          # --- Calculer les IDs à conserver ---
          # Stratégie : garder "main"/"master"/"develop" + les N plus récentes
          KEEP_IDS=$(echo "$VERSIONS_JSON" | jq -r --argjson min_keep "$MIN_KEEP" '
            def is_protected: ((.metadata.container.tags // []) | any(. == "main" or . == "master" or . == "develop" or . == "buildcache"));
            [.[] | select(is_protected)] as $protected
            |
            ([.[] | select(is_protected | not)] | sort_by(.created_at) | reverse) as $others
            |
            ($others[:$min_keep]) as $keep_recent
            |
            ([$protected[], $keep_recent[]] | map(.id | tostring))
          ')

          echo "IDs à conserver :"
          echo "$KEEP_IDS" | jq -r '.[]'
          echo ""

          # --- Calculer les IDs à supprimer ---
          DELETE_IDS=$(echo "$VERSIONS_JSON" | jq -r --argjson keep "$KEEP_IDS" '
            [.[] | select((.id | tostring) as $id | $keep | index($id) | not) | .id]
          ')

          DELETE_COUNT=$(echo "$DELETE_IDS" | jq 'length')
          echo "Versions à supprimer : $DELETE_COUNT"

          if [ "$DELETE_COUNT" -eq 0 ]; then
            echo "Rien à supprimer."
            exit 0
          fi

          # Afficher ce qui sera supprimé
          echo ""
          echo "=== Versions à supprimer ==="
          echo "$VERSIONS_JSON" | jq -r --argjson delete_ids "$DELETE_IDS" '
            ($delete_ids | map(tostring)) as $del_str
            |
            [.[] | select((.id | tostring) as $id | $del_str | index($id))]
            | .[]
            | [.id, (.metadata.container.tags[0] // "untagged"), .created_at]
            | @tsv
          ' | sort -t$'\t' -k3 -r

          # --- Suppression ---
          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "=== DRY RUN — aucune suppression effectuée ==="
            exit 0
          fi

          echo ""
          echo "=== Suppression en cours ==="

          DELETED=0
          FAILED=0

          for VERSION_ID in $(echo "$DELETE_IDS" | jq -r '.[]'); do
            TAG=$(echo "$VERSIONS_JSON" | jq -r --arg id "$VERSION_ID" \
              '.[] | select(.id | tostring == $id) | .metadata.container.tags[0] // "untagged"')

            # gh api n'a pas d'option -w/--write-out (c'est un flag curl) :
            # la capture du code HTTP se fait avec curl. Retry sur 429/5xx
            # (rate limit GitHub), 404 toléré (version déjà supprimée par un
            # run précédent).
            HTTP_CODE=""
            for _ in 1 2 3; do
              HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com${PACKAGES_BASE}/container/${PACKAGE_NAME}/versions/${VERSION_ID}")

              case "$HTTP_CODE" in
                204|404) break ;;
                429|5*) sleep 10 ;;
                *) break ;;
              esac
            done

            case "$HTTP_CODE" in
              204)
                echo "  [OK] Supprimé : version $VERSION_ID (tag: $TAG)"
                DELETED=$((DELETED + 1))
                ;;
              404)
                echo "  [OK] Déjà supprimée : version $VERSION_ID (tag: $TAG)"
                DELETED=$((DELETED + 1))
                ;;
              *)
                echo "  [ERR] Échec suppression version $VERSION_ID (tag: $TAG) — HTTP $HTTP_CODE"
                FAILED=$((FAILED + 1))
                ;;
            esac
          done

          echo ""
          echo "=== Résumé ==="
          echo "Supprimées : $DELETED"
          echo "Échecs     : $FAILED"

          # --- Afficher les versions restantes ---
          echo ""
          echo "=== Versions restantes ==="
          gh api \
            -H "Accept: application/vnd.github+json" \
            "${PACKAGES_BASE}/container/${PACKAGE_NAME}/versions?per_page=100" \
            --jq '.[] | [.metadata.container.tags[0] // "untagged", .created_at] | @tsv' \
            | sort -t$'\t' -k2 -r

          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::${FAILED} suppressions ont échoué"
            exit 1
          fi
