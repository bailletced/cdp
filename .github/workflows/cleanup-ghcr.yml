name: Cleanup GHCR

# F03-T18 : nettoyage des anciennes versions d'images GHCR.
# Garde les 20 dernières versions, supprime le reste.
# S'exécute hebdomadairement et après chaque push sur main.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Tous les lundis à 3h UTC
  workflow_dispatch:

jobs:
  cleanup:
    name: Delete old image versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Delete old versions (keep 20)
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.repository }}
          package-type: container
          min-versions-to-keep: 20
          ignore-versions: '^main$'
