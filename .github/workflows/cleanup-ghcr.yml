name: Cleanup GHCR

# F03-T18 : nettoyage des anciennes versions d'images GHCR.
# Garde les N dernières versions (tags sha-*), supprime le reste.
# Le tag "main" est ignoré (toujours conservé).
# S'exécute hebdomadairement, après chaque push sur main, et manuellement.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Tous les lundis à 3h UTC
  workflow_dispatch:
    inputs:
      min_versions_to_keep:
        description: 'Nombre de versions à conserver'
        required: false
        default: '20'
      dry_run:
        description: 'Dry run (ne supprime rien)'
        required: false
        type: boolean
        default: false

jobs:
  cleanup:
    name: Delete old image versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      # Debug : lister les versions existantes avant suppression
      - name: List existing versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          echo "=== Packages GHCR pour ${{ github.repository }} ==="
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages?package_type=container" \
            --jq '.[] | select(.name=="'"$PACKAGE_NAME"'") | {id, name, version_count: .versions_count}'

          echo ""
          echo "=== Versions du package $PACKAGE_NAME ==="
          PACKAGE_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME" \
            --jq '.id')

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions?per_page=100" \
            --jq '.[] | {id, name: .metadata.container.tags[0], created_at} | @tsv' | sort -k3 -r | head -30

      - name: Delete old versions
        if: ${{ !inputs.dry_run }}
        uses: actions/delete-package-versions@v5
        with:
          # Le nom du package GHCR = nom du repo (sans le owner).
          # Ex: bailletced/cdp → package-name: cdp
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: ${{ inputs.min_versions_to_keep || '20' }}
          # Ignore le tag "main" (toujours conservé) et les tags de branche.
          ignore-versions: '^(main|master|develop)$'
          # Token explicite (évite les problèmes de permission).
          token: ${{ secrets.GITHUB_TOKEN }}
          # Supprime aussi les versions non taggées (digest seul).
          delete-only-untagged-versions: false

      # Debug : lister les versions restantes après suppression
      - name: List remaining versions
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          echo "=== Versions restantes (après cleanup) ==="
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions?per_page=100" \
            --jq '.[] | {name: .metadata.container.tags[0], created_at} | @tsv' | sort -k2 -r | head -25

          echo ""
          echo "Total: $(gh api -H "Accept: application/vnd.github+json" "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME" --jq '.version_count') versions"
