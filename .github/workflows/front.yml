name: Front CI

on:
  push:
    branches: [main, feature/**]
    paths:
      - 'front/**'
      - '!front/node_modules/**'
      - '!front/dist/**'
  pull_request:
    branches: [main]
    paths:
      - 'front/**'
      - '!front/node_modules/**'
      - '!front/dist/**'

jobs:
  front:
    name: Front QA & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: corepack enable

      - name: Cache pnpm
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node-${{ hashFiles('front/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          cd front
          pnpm install --frozen-lockfile

      - name: Run Biome
        run: |
          cd front
          pnpm exec biome ci

      - name: Run TypeScript type check
        run: |
          cd front
          pnpm exec tsc --noEmit

      - name: Run Vitest
        run: |
          cd front
          pnpm exec vitest run

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-test-results
          path: front/test-results/
