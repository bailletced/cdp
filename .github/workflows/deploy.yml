name: Deploy

# F03-T17 : déploiement continu à chaque fusion sur main.
# Appelle les webhooks Portainer (worker d'abord pour les migrations,
# puis app), attend que /health retourne le SHA déployé (10 min max).
#
# Les webhooks Portainer redéploient le service avec l'image configurée
# (:main). L'Image CI pousse :main avec le même SHA que :sha-<sha>, donc
# le /health reflète le bon SHA après redéploiement.
#
# Secrets requis (environnement GitHub "production") :
#   PORTAINER_WEBHOOK_WORKER : URL webhook Portainer du service cdp_worker
#   PORTAINER_WEBHOOK_APP    : URL webhook Portainer du service cdp_app
#   PRODUCTION_URL           : https://bailletced.org

on:
  workflow_run:
    workflows: ["Image CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')

    env:
      # En workflow_run, on prend head_sha du run original pour avoir
      # le commit poussé sur main.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Deploy worker (migrations first)
        run: |
          echo "Calling worker webhook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.PORTAINER_WEBHOOK_WORKER }}" || echo "000")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "Worker webhook called successfully (HTTP $HTTP_CODE)"
          else
            echo "::error::Worker webhook failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Wait for worker migrations
        run: sleep 30

      - name: Deploy app
        run: |
          echo "Calling app webhook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.PORTAINER_WEBHOOK_APP }}" || echo "000")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "App webhook called successfully (HTTP $HTTP_CODE)"
          else
            echo "::error::App webhook failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Wait for /health to return the deployed SHA (max 10 min)
        run: |
          EXPECTED_SHA="sha-${{ env.DEPLOY_SHA }}"
          URL="${{ secrets.PRODUCTION_URL }}/health"

          echo "Attente du déploiement de $EXPECTED_SHA sur $URL"
          echo ""

          for i in $(seq 1 60); do
            RESPONSE=$(curl -sf "$URL" 2>/dev/null || true)
            if [ -n "$RESPONSE" ]; then
              ACTUAL_SHA=$(echo "$RESPONSE" | grep -o '"version":"[^"]*"' | cut -d'"' -f4 || true)
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                echo ""
                echo "Deploiement confirmé : $ACTUAL_SHA"
                exit 0
              fi
              echo "Tentative $i/60 : en attente de $EXPECTED_SHA, reçu ${ACTUAL_SHA:-<none>}"
            else
              echo "Tentative $i/60 : /health ne répond pas encore"
            fi
            sleep 10
          done

          echo ""
          echo "::error::Timeout : /health n'a pas retourné $EXPECTED_SHA après 10 minutes"
          exit 1

      - name: Deployment summary
        run: |
          echo "Déployé : sha-${{ env.DEPLOY_SHA }}"
          echo "URL     : ${{ secrets.PRODUCTION_URL }}"
          echo ""
          echo "Health check :"
          curl -sf "${{ secrets.PRODUCTION_URL }}/health" | jq .
