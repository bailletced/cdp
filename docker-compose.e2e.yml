# Compose de test e2e sur l'image de production (F03-T16).
# Utilisé par la CI pour valider l'image avant déploiement.
#
# Usage :
#   docker build --target prod -t cdp-prod:test --build-arg SHA=test .
#   IMAGE_TAG=test docker compose -f docker-compose.e2e.yml up -d
#   cd front && pnpm exec playwright test --config=playwright.config.ts

services:
  app:
    image: cdp-prod:${IMAGE_TAG:-test}
    command: ["app"]
    environment:
      APP_ENV: prod
      APP_SECRET: e2e-secret
      APP_SHA: ${IMAGE_TAG:-test}
      SERVER_NAME: ":80"
      DATABASE_URL: postgresql://app:app@database:5432/app?serverVersion=18&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      DEFAULT_URI: http://localhost:9080
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "9080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    image: cdp-prod:${IMAGE_TAG:-test}
    command: ["worker"]
    environment:
      APP_ENV: prod
      APP_SECRET: e2e-secret
      APP_SHA: ${IMAGE_TAG:-test}
      DATABASE_URL: postgresql://app:app@database:5432/app?serverVersion=18&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
