# Traefik v3 (F03-T10) — Reverse proxy edge pour CDP.
# Déploiement : docker stack deploy -c docker/stack/traefik.yaml traefik
#
# Prérequis :
#   - Réseau "edge" créé (docker network create --driver overlay --attachable edge)
#   - Service "app" déployé avec les labels Traefik (voir stack.yaml)
#   - DNS pointant vers le VPS (F03-T02)
#
# Certificats : Let's Encrypt staging d'abord (ACME_STAGING=true),
# puis production (ACME_STAGING=false).

version: "3.8"

services:
  traefik:
    image: traefik:v3.3
    command:
      # Provider Docker Swarm
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=edge
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirection HTTP → HTTPS
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      # ACME Let's Encrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Staging par défaut (rate limits), passer ACME_STAGING=false en prod
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      # Logs
      - --log.level=INFO
      - --accesslog=true
      # API (désactivée par défaut, à activer pour debug)
      - --api.dashboard=false
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - edge
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
      labels:
        # Middleware security-headers (F03-T11) : en-têtes de sécurité HTTP.
        # Référencé par le service app : security-headers@swarm
        - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
        - traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.security-headers.headers.stsPreload=true
        - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
        - traefik.http.middlewares.security-headers.headers.referrerPolicy=same-origin
        - traefik.http.middlewares.security-headers.headers.permissionsPolicy=geolocation=(), microphone=(), camera=()
        - traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-Frame-Options=DENY
        - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    external: true

volumes:
  traefik_letsencrypt:
    driver: local
