# Traefik v3.6 (F03-T10) — Reverse proxy edge pour CDP.
# Déploiement : docker stack deploy -c docker/stack/traefik.yaml traefik
#
# Prérequis :
#   - Réseau "edge" créé (docker network create --driver overlay --attachable edge)
#   - Service "app" déployé avec les labels Traefik (voir stack.yaml)
#   - DNS pointant vers le VPS (F03-T02)
#   - Docker 29.x : nécessite Traefik >= v3.6.1 (fix API version, issue #12253)
#
# Certificats : Let's Encrypt production par défaut (ACME_CA_SERVER
# surchargeable, ex. staging pour tester hors rate limits).

version: "3.8"

services:
  traefik:
    image: traefik:v3.6.1
    command:
      # Provider Docker Swarm
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=edge
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirection HTTP → HTTPS
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      # ACME Let's Encrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@bailletced.org}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Production par défaut ; staging (rate limits) : ACME_CA_SERVER=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # Logs
      - --log.level=INFO
      - --accesslog=true
      # API (désactivée par défaut, à activer pour debug)
      - --api.dashboard=false
    # Mode host (F15-T02) : en mode ingress, le routing mesh de Swarm
    # remplace l'IP du client par une IP interne, la même pour tout le
    # monde ; l'anti-abus compterait alors tous les visiteurs ensemble.
    # Un seul Traefik, sur le nœud manager : le mode host suffit.
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - edge
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
      # NOTE : le middleware security-headers@swarm est défini sur le service
      # app (stack.yaml) car exposedByDefault=false empêche Traefik de traiter
      # ses propres labels sans traefik.enable=true (qui causerait une erreur
      # "port is missing" car le service Traefik n'a pas de port de service LB).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    external: true

volumes:
  traefik_letsencrypt:
    driver: local
