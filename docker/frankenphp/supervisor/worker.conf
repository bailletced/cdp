; Supervisor config pour le worker CDP (F03-T09).
; Deux consommateurs Messenger (un par file PostgreSQL) :
;   - async_transactional : messages transactionnels (liens magiques, emails)
;   - async_bulk          : messages bulk (imports, rapports)
;
; Supervisor les redémarre automatiquement s'ils plantent (autorestart=true).
; Le conteneur reste up tant que supervisord tourne → Swarm voit 1/1.

[program:messenger-transactional]
command=php /app/api/bin/console messenger:consume async_transactional --time-limit=3600 --memory-limit=128M
directory=/app/api
autostart=true
autorestart=true
startretries=10
startsecs=5
stopwaitsecs=30
stopsignal=TERM
user=appuser
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:messenger-bulk]
command=php /app/api/bin/console messenger:consume async_bulk --time-limit=3600 --memory-limit=128M
directory=/app/api
autostart=true
autorestart=true
startretries=10
startsecs=5
stopwaitsecs=30
stopsignal=TERM
user=appuser
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
