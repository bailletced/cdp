framework:
    messenger:
        default_bus: command.bus
        buses:
            # Chaque commande s'exécute dans une transaction : une exception l'annule entièrement.
            command.bus:
                middleware:
                    - doctrine_transaction
            # Dispatch in-process, mais le routing ci-dessous envoie les DomainEvent vers
            # l'outbox async_transactional : écrits dans la transaction de la commande
            # (DispatchAfterCurrentBusStamp, voir MessengerEventBus), traités par le worker
            # APRÈS le commit — jamais dans la requête. Pas de doctrine_transaction ici :
            # les listeners n'ont aucune transaction englobante, leurs adapters flushent
            # explicitement (voir AccountPriantDirectory).
            event.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
        failure_transport: failed
        transports:
            sync: 'sync://'
            # Transport pour les messages transactionnels (haute priorité)
            async_transactional:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    table_name: messenger_messages_async_transactional
                    queue_name: async_transactional
                    use_notify: true
                retry_strategy:
                    max_retries: 5
                    delay: 60000  # 1 minute
                    multiplier: 1
                    max_delay: 60000
            # Transport pour les campagnes (basse priorité)
            async_bulk:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    table_name: messenger_messages_async_bulk
                    queue_name: async_bulk
                    use_notify: true
                retry_strategy:
                    max_retries: 5
                    delay: 60000  # 1 minute
                    multiplier: 1
                    max_delay: 60000
            # Transport pour les messages en échec
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    table_name: messenger_messages_failed
                    queue_name: failed
                    use_notify: true
        routing:
            App\Shared\Application\Command\CommandInterface: sync
            # Domain events are persisted in the async_transactional outbox:
            # they are consumed by the worker after the command transaction
            # commits (transactional outbox pattern).
            App\Shared\Domain\Event\DomainEvent: async_transactional
            # Messages transactionnels (haute priorité)
            App\Shared\Application\Message\ConfirmationMessage: async_transactional
            App\Shared\Application\Message\LinkMessage: async_transactional
            App\Shared\Application\Message\ReminderMessage: async_transactional
            # Messages bulk (basse priorité)
            App\Shared\Application\Message\CampaignMessage: async_bulk
