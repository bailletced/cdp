api_platform:
    title: 24 heures de prière
    description: API de la Communion de prière Notre-Dame du Mont-Carmel
    version: 1.0.0
    # Les ressources API Platform vivent dans <BC>/Infrastructure/ApiPlatform :
    # API Platform 5 ne scanne que src/ApiResource et src/Entity par défaut.
    mapping:
        paths: ['%kernel.project_dir%/src']
    # JSON-LD/Hydra par défaut et merge-patch pour PATCH : valeurs par défaut d'API Platform 5 (T8).
    defaults:
        # L'authentification passe par la session Symfony (T14).
        stateless: false
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
