doctrine:
    dbal:
        # En dev/test, l'URL complète est dans DATABASE_URL (voir .env).
        # En prod, les champs sont définis séparément (voir config/packages/prod/doctrine.yaml).
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        mappings:
            # Objets-valeur partagés (Email, identifiants), embarqués par les entités de chaque BC.
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Domain'
                prefix: App\Shared\Domain
            # Context Access (comptes, authentification)
            Access:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Access/Domain'
                prefix: App\Access\Domain
            # Context Chain (éditions, créneaux, inscriptions)
            Chain:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Chain/Domain'
                prefix: App\Chain\Domain

when@dev:
    doctrine:
        dbal:
            url: '%env(resolve:DATABASE_URL)%'

when@test:
    doctrine:
        dbal:
            url: '%env(resolve:DATABASE_URL)%'
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
