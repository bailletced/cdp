# Production : secret lu depuis le fichier Docker Swarm (F03-T08).
framework:
    secret: '%env(trim:file:APP_SECRET_FILE)%'
    # Behind Traefik (reverse proxy): trust X-Forwarded-* headers so Symfony
    # knows the external scheme/host/port. The app is only reachable through
    # Traefik (port 80 not published): private subnets (Swarm overlay) are safe.
    # Without this, SameOriginListener compares Origin port 443 against the
    # internal port 80 and rejects same-origin POSTs with 403.
    trusted_proxies: 'private_subnets'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']
