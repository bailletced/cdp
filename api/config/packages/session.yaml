framework:
    session:
        # Use the reconnecting PdoSessionHandler decorator for PostgreSQL session storage
        handler_id: session.handler.pdo
        # Session cookie configuration
        name: __Host-Session
        cookie_path: /
        cookie_domain: null
        cookie_secure: true
        cookie_httponly: true
        cookie_samesite: lax

services:
    # Dedicated PDO factory for the session handler. The handler must never
    # share the PDO captured from the Doctrine connection: DBAL closes and
    # replaces that instance when it reconnects, which would leave the session
    # handler with a dead connection (the production incident of 2026-10-24).
    session.pdo_factory:
        class: App\Shared\Infrastructure\Symfony\Session\DoctrineSessionPdoFactory
        arguments: ['@doctrine.dbal.default_connection']

    # PdoSessionHandler decorator: rebuilds the handler on a fresh PDO and
    # retries once when its connection was lost. FrankenPHP worker mode keeps
    # the handler alive across requests, so its connection can die while idle.
    session.handler.pdo:
        class: App\Shared\Infrastructure\Symfony\Session\ReconnectingPdoSessionHandler
        arguments:
            - '@session.pdo_factory'
            - db_table: sessions
              lock_mode: 0
