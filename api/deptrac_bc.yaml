# deptrac: checks the hexagonal layering (Boundary Control)
# No layer may depend on a higher (more external) layer:
# Domain is the innermost layer, Infrastructure the outermost, Tests on top.

deptrac:
  paths:
    - ./src
    - ./tests

  layers:
    # Domain layer (innermost)
    - name: Domain
      collectors:
        - type: directory
          value: src/Shared/Domain/.*
        - type: directory
          value: src/Chain/Domain/.*
        - type: directory
          value: src/Access/Domain/.*

    # Application layer
    - name: Application
      collectors:
        - type: directory
          value: src/Shared/Application/.*
        - type: directory
          value: src/Chain/Application/.*
        - type: directory
          value: src/Access/Application/.*

    # Infrastructure layer
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Shared/Infrastructure/.*
        - type: directory
          value: src/Chain/Infrastructure/.*
        - type: directory
          value: src/Access/Infrastructure/.*

    # Tests
    - name: Tests
      collectors:
        - type: directory
          value: tests/.*

  ruleset:
    Domain: []
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
    Tests:
      - Domain
      - Application
      - Infrastructure
