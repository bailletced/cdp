# deptrac: checks the isolation between the Chain and Access modules.
# Both modules may only depend on Shared; any Chain <-> Access dependency
# is a violation (it is absent from the ruleset below).

deptrac:
  paths:
    - ./src

  layers:
    # Chain module (prayer chain)
    - name: Chain
      collectors:
        - type: directory
          value: src/Chain/.*

    # Access module (authentication)
    - name: Access
      collectors:
        - type: directory
          value: src/Access/.*

    # Shared module
    - name: Shared
      collectors:
        - type: directory
          value: src/Shared/.*

  ruleset:
    Chain:
      - Shared
    Access:
      - Shared
    Shared: []
